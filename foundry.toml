[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.24"
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true

gas_reports = ["TreasuryVault", "TreasuryController"]
fuzz = { runs = 256 }

remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/"
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
bittensor = "${BITTENSOR_RPC_URL}"
bittensor_testnet = "${BITTENSOR_TESTNET_RPC_URL}"

[etherscan.bittensor]
chain = 8299
url = "https://evm.taostats.io/api/"
key = "${BITTENSOR_API_KEY}"