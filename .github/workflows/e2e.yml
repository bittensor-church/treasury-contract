name: E2E Tests

permissions:
  contents: read

on:
  push:
    branches: [master, chore/code-refactoring]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  e2e:
    name: Localnet E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        suite: [native, alpha, erc20]

    services:
      subtensor:
        image: ghcr.io/opentensor/subtensor-localnet:main
        ports:
          - 9944:9944
          - 9945:9945
          - 9946:9946

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Wait for subtensor to be ready
        run: |
          echo "Waiting for subtensor localnet..."
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url http://127.0.0.1:9944 2>/dev/null; then
              echo "Subtensor is ready!"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 2
          done
          echo "Subtensor failed to start"
          exit 1

      - name: Run E2E suite
        run: |
          chmod +x scripts/localnet-e2e-${{ matrix.suite }}.sh
          ./scripts/localnet-e2e-${{ matrix.suite }}.sh

      - name: Collect subtensor logs
        if: failure()
        run: docker logs "${{ job.services.subtensor.id }}" 2>&1 | tail -200 || true
