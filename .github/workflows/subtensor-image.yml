name: Build Subtensor Localnet Image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Subtensor source repo (owner/name)"
        required: true
        default: bittensor-church/subtensor
      source_ref:
        description: "Branch, tag or commit to build"
        required: true
        default: devnet-ready
      tag:
        description: "Image tag (published to ghcr.io/<owner>/subtensor-localnet:<tag>)"
        required: true
        default: devnet-ready

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout subtensor source
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: subtensor
          persist-credentials: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: subtensor
          file: subtensor/Dockerfile-localnet
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/subtensor-localnet:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
